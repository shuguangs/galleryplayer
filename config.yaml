# Live Subtitle 配置
# 复制为 config.yaml 后按需修改

# ---- 识别（whisper）----
asr:
  model: "large-v3"        # 模型：tiny/base/small/medium/large-v3（越大越准越慢）
  device: "cuda"           # cuda = NVIDIA 显卡；cpu = 纯 CPU
  compute: "float16"       # cuda 用 float16；cpu 用 int8
  language: "en"           # 原声语言：en/ja/ko/fr/de/es...（留空=自动检测）
  beam_size: 5             # 束搜索宽度（实时场景可降到 1 更快）

# ---- 翻译（Ollama 本地大模型）----
translate:
  enabled: true
  endpoint: "http://127.0.0.1:11434"   # Ollama 服务地址
  model: "qwen2.5:7b"      # Ollama 模型名（中文翻译推荐 qwen2.5 系列）
  target_lang: "zh"        # 目标语言（zh = 简体中文）
  chunk_sentences: 3       # 每多少句合并成一段翻译（批次大更快，越大越粗）

# ---- 输出 ----
output:
  show_original: true      # 字幕同时显示原语
  srt: true                # 同时导出 .srt 字幕文件