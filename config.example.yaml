# Live Subtitle 配置
# 复制为 config.yaml 后按需修改

# ---- 识别（whisper）----
# 档位选择（GPU 实测 The Pitt 60s，5060Ti）：
#   small   ~460MB  转写 x4.2 实时率  最快最省，个别词有错
#   medium  ~1.5GB  转写 x8.4 实时率  性价比之王（推荐）
#   large-v3 ~3GB  转写 x6.3 实时率  最准，加载慢（38s）
asr:
  model: "medium"         # tiny/base/small/medium/large-v3（无独显 CPU 用 small）
  device: "cuda"           # cuda = NVIDIA 显卡；cpu = 纯 CPU
  compute: "float16"       # cuda 用 float16；cpu 用 int8
  language: "en"           # 原声语言：en/ja/ko/fr/de/es...（留空=自动检测）
  beam_size: 5             # 束搜索宽度（实时场景可降到 1 更快）

# ---- 翻译（Ollama 本地大模型）----
# 档位选择（本机实测）：
#   qwen2.5:3b   2.1GB  短句 <0.2s，日常对话足够；专业术语一般
#   qwen2.5:7b   3.8GB  短句 <0.2s，专业术语/长句更准确（推荐）
translate:
  enabled: true
  endpoint: "http://127.0.0.1:11434"   # Ollama 服务地址
  model: "qwen2.5:7b"      # Ollama 模型名（qwen2.5:3b / qwen2.5:7b / 其他）
  target_lang: "zh"        # 目标语言（zh = 简体中文）
  chunk_sentences: 3       # 每多少句合并成一段翻译（批次大更快，越大越粗）

# ---- 输出 ----
output:
  show_original: true      # 字幕同时显示原语
  srt: true                # 同时导出 .srt 字幕文件