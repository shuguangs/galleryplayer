# Live Subtitle 配置
# 复制为 config.yaml 后按需修改

# ---- 识别引擎 ----
# 引擎选择（本机实测：RTX 5060 Ti，TTS 中/日/英样本 + The Pitt 60s）：
#   qwen        4.7GB  6GB 显存  52 语言+22 中文方言，自带语种识别，中/英零错误（推荐）
#   sensevoice  0.9GB  2GB 显存  中日韩粤快而准（CPU 也可实时），英语明显较弱
#   medium      1.5GB  4GB 显存  whisper 通用款，中文数字偶错
#   large-v3    5.8GB  8GB 显存  whisper 语言覆盖最广，加载慢（约 40s）
#   small/base/tiny        1-2GB 显存  低配机器兜底，识别较粗
asr:
  model: "qwen"            # qwen/sensevoice/tiny/base/small/medium/large-v3
  device: "cuda"           # cuda = NVIDIA 显卡；cpu = 纯 CPU
  compute: "float16"       # 仅 whisper 用：cuda→float16，cpu→int8
  language: "auto"         # auto=自动识别语种；或 zh/yue/en/ja/ko/fr/de/es...
  beam_size: 5             # 仅 whisper 用：束搜索宽度（实时场景可降到 1 更快）

# ---- 翻译（Ollama 本地大模型）----
# 档位选择（本机实测）：
#   qwen2.5:3b   2.1GB  短句 <0.2s，日常对话足够；专业术语一般
#   qwen2.5:7b   3.8GB  短句 <0.2s，专业术语/长句更准确（推荐）
translate:
  enabled: true
  endpoint: "http://127.0.0.1:11434"   # Ollama 服务地址
  model: "qwen2.5:7b"      # Ollama 模型名（qwen2.5:3b / qwen2.5:7b / 其他）
  target_lang: "zh"        # 目标语言（zh = 简体中文）
  chunk_sentences: 3       # 每多少句合并成一段翻译（批次大更快，越大越粗）

# ---- 输出 ----
output:
  show_original: true      # 字幕同时显示原语
  srt: true                # 同时导出 .srt 字幕文件