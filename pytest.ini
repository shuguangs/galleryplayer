[pytest]
# 关掉 pytest 自带的 faulthandler。
#
# libmpv 内置的 LuaJIT 每次初始化都会抛一个它自己接住的 SEH 异常 (0xe24c4a02)。
# faulthandler 在 Windows 上靠向量化异常处理器拦截，对这类"已处理"异常也会
# 逐线程转储栈；转储时别的线程正在建/拆 mpv，读到正在释放的线程状态就真的
# access violation，测试进程无报错直接退出（全套约 3 成运行会这样）。
#
# 对照实验（同一个并发建 mpv 的负载，各 20 个进程）：关 faulthandler 0 次崩溃，
# 开 5 次。本配置生效后全套连跑 20 次 0 次崩溃（改前 14 次崩 4 次）。
# 发布的程序从不开 faulthandler，不受影响。
addopts = -p no:faulthandler
